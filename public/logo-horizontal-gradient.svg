<?xml version="1.0" encoding="UTF-8"?>
<svg width="450" height="120" viewBox="0 0 450 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Defini&#231;&#245;es de gradientes -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- S&#237;mbolo: Teto tech com movimento -->
  <g transform="translate(20, 30)">
    <!-- Base estrutural -->
    <rect x="0" y="48" width="65" height="4" rx="2" fill="url(#blueGradient)" opacity="0.3"/>

    <!-- Pain&#233;is retr&#225;teis (3 layers) -->
    <rect x="5" y="5" width="55" height="12" rx="3" fill="url(#blueGradient)" opacity="0.9"/>
    <rect x="8" y="20" width="49" height="12" rx="3" fill="url(#blueGradient)" opacity="0.7"/>
    <rect x="12" y="35" width="41" height="10" rx="3" fill="url(#blueGradient)" opacity="0.5"/>

    <!-- Indicador de automa&#231;&#227;o -->
    <circle cx="60" cy="26" r="6" fill="url(#greenAccent)"/>
    <path d="M 57 26 L 59 28 L 63 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Texto -->
  <g transform="translate(105, 52)">
    <text font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#1E293B" letter-spacing="2.5">
      COBERSYSTEM
    </text>
  </g>

  <!-- Tagline com gradiente -->
  <g transform="translate(105, 72)">
    <text font-family="system-ui, sans-serif" font-size="10" fill="url(#blueGradient)" letter-spacing="3" font-weight="500">
      TECNOLOGIA EM COBERTURAS
    </text>
  </g>

  <!-- Linha decorativa -->
  <rect x="105" y="78" width="80" height="2" rx="1" fill="url(#greenAccent)" opacity="0.6"/>
</svg>
